name: Verifica struttura gestionale
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: temporary-ci-only
          POSTGRES_DB: piva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d piva_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepara Python isolato
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-lock.txt
          .venv/bin/python -m pip check
      - name: Controlla sintassi
        run: .venv/bin/python -m compileall -q -x '/\.venv/' .
      - name: Esegui test senza database
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: SQL su PostgreSQL temporaneo (nessun Supabase)
        env:
          PIVA_SQL_TEST: temporary-ci-database
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: piva_test
          PGUSER: postgres
          PGPASSWORD: temporary-ci-only
        run: .venv/bin/python tests/check_sql.py

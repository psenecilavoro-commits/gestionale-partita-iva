name: React migration parity
on:
  push:
    branches: ['migration/react-cloudflare']
  pull_request:
    paths: ['web/**', 'migration/**']
jobs:
  browser-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
